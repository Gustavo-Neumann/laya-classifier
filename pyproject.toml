[project]
name = "laya-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gustavo Neumann", email = "gneumann7164@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "laya>=0.3.21",
    "pika>=1.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
laya-classifier = "laya_classifier:main"
laya-classifier-worker = "laya_classifier.worker:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
